name: macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*/v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          # locked: false because pixi.lock does not yet include osx platforms;
          # the lock file will be updated once macOS is added to the CI baseline
          locked: false
          cache-write: ${{ github.event_name != 'pull_request' }}

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-macos-${{ matrix.arch }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-macos-${{ matrix.arch }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-

      - name: Build & Test
        run: pixi run all

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXT_NAME="${{ github.ref_name }}"
          EXT_NAME="${EXT_NAME%/*}"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION##*/}"
          VERSION="${VERSION#v}"
          ZIP_NAME="${EXT_NAME}-${VERSION}-macos-${{ matrix.arch }}.zip"
          mkdir -p "dist/${EXT_NAME}"
          find build/Release -name "${EXT_NAME}.dylib" -exec cp {} "dist/${EXT_NAME}/" \; 2>/dev/null || true
          cp "extensions/${EXT_NAME}/manifest.json" "dist/${EXT_NAME}/" 2>/dev/null || true
          ls -la "dist/${EXT_NAME}/"
          cd dist && zip -r "../${ZIP_NAME}" .
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
