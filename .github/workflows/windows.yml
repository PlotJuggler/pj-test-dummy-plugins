name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          cache-write: ${{ github.event_name != 'pull_request' }}

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\conan\p
          key: conan-windows-x64-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-windows-x64-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-windows-x64-${{ github.sha }}
          restore-keys: ccache-windows-x64-

      - name: Build & Test
        run: pixi run all

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          find build/Release -name "*.dll" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Compress artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "pj-test-dummy-plugins-${{ github.ref_name }}-windows-x64.zip"
          Write-Host "Package created: pj-test-dummy-plugins-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pj-test-dummy-plugins-${{ github.ref_name }}-windows-x64
          path: pj-test-dummy-plugins-${{ github.ref_name }}-windows-x64.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pj-test-dummy-plugins-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
