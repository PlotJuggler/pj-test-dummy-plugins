name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*/v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            os_label: linux
            lib_ext: so
          - runner: ubuntu-22.04-arm
            arch: aarch64
            os_label: linux
            lib_ext: so
          - runner: macos-13
            arch: x86_64
            os_label: macos
            lib_ext: dylib
          - runner: macos-14
            arch: arm64
            os_label: macos
            lib_ext: dylib
          - runner: windows-latest
            arch: x64
            os_label: windows
            lib_ext: dll
          - runner: windows-11-arm
            arch: arm64
            os_label: windows
            lib_ext: dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pixi manages the full toolchain (cmake, ninja, conan, ccache) on all
      # platforms except windows-11-arm: conda-forge does not ship cmake,
      # conan or ccache for win-arm64. The runner provides cmake 3.31 and
      # Python/pip pre-installed, which is used instead for that job.
      - name: Setup pixi
        if: matrix.runner != 'windows-11-arm'
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          locked: false
          cache-write: ${{ github.event_name != 'pull_request' }}

      - name: Install conan (windows-arm64)
        if: matrix.runner == 'windows-11-arm'
        run: pip install "conan>=2.0,<3"

      - name: Cache conan packages (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os_label }}-${{ matrix.arch }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os_label }}-${{ matrix.arch }}-

      - name: Cache conan packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\conan\p
          key: conan-${{ matrix.os_label }}-${{ matrix.arch }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os_label }}-${{ matrix.arch }}-

      - name: Cache ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os_label }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os_label }}-${{ matrix.arch }}-

      - name: Cache ccache (Windows x64)
        if: matrix.runner == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-windows-x64-${{ github.sha }}
          restore-keys: ccache-windows-x64-

      - name: Build & Test (pixi)
        if: matrix.runner != 'windows-11-arm'
        run: pixi run all

      # windows-11-arm: cmake 3.31 and MSVC are pre-installed on the runner.
      # conan is installed via pip above. ccache is not available for win-arm64
      # on conda-forge, so it is omitted for this platform.
      - name: Build & Test (windows-arm64)
        if: matrix.runner == 'windows-11-arm'
        shell: bash
        run: |
          conan profile detect --force
          conan install . --output-folder=build --build=missing -s build_type=Release
          cmake -S . -B build/Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON
          cmake --build build/Release --config Release
          ctest --test-dir build/Release -V --output-on-failure

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXT_NAME="${{ github.ref_name }}"
          EXT_NAME="${EXT_NAME%/*}"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION##*/}"
          VERSION="${VERSION#v}"
          ZIP_NAME="${EXT_NAME}-${VERSION}-${{ matrix.os_label }}-${{ matrix.arch }}.zip"
          mkdir -p "dist/${EXT_NAME}"
          find build/Release -name "${EXT_NAME}.${{ matrix.lib_ext }}" -exec cp {} "dist/${EXT_NAME}/" \; 2>/dev/null || true
          cp "extensions/${EXT_NAME}/manifest.json" "dist/${EXT_NAME}/" 2>/dev/null || true
          ls -la "dist/${EXT_NAME}/"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Compress artifacts (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r "../${{ env.ZIP_NAME }}" .

      - name: Compress artifacts (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "$env:ZIP_NAME"
          Write-Host "Package created: $env:ZIP_NAME"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: ${{ matrix.runner == 'ubuntu-22.04' }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
