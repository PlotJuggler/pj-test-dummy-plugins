name: build

on:
  workflow_dispatch:
  push:
    tags: ['*/v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            os_label: linux
            lib_ext: so
          - runner: ubuntu-22.04-arm
            arch: aarch64
            os_label: linux
            lib_ext: so
          - runner: macos-15-intel
            arch: x86_64
            os_label: macos
            lib_ext: dylib
          - runner: macos-14
            arch: arm64
            os_label: macos
            lib_ext: dylib
          - runner: windows-latest
            arch: x64
            os_label: windows
            lib_ext: dll
          - runner: windows-11-arm
            arch: arm64
            os_label: windows
            lib_ext: dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cmake and conan installed via pip — available on all 6 runners.
      # Compilers are provided by each runner image (gcc/clang/MSVC).
      - name: Install cmake, ninja and conan
        run: pip install cmake ninja "conan>=2.0,<3"

      # Ninja + MSVC requires the MSVC developer environment to be activated.
      # ilammy/msvc-dev-cmd sets up cl.exe, link.exe and Windows SDK headers/libs.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache conan packages (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os_label }}-${{ matrix.arch }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os_label }}-${{ matrix.arch }}-

      - name: Cache conan packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\conan\p
          key: conan-${{ matrix.os_label }}-${{ matrix.arch }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os_label }}-${{ matrix.arch }}-

      - name: Build & Test
        shell: bash
        run: |
          conan profile detect --force
          conan install . --output-folder=build --build=missing -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator=Ninja
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH=build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON
          cmake --build build/Release --config Release
          ctest --test-dir build/Release -V --output-on-failure

      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXT_NAME="${{ github.ref_name }}"
          EXT_NAME="${EXT_NAME%/*}"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION##*/}"
          VERSION="${VERSION#v}"
          ZIP_NAME="${EXT_NAME}-${VERSION}-${{ matrix.os_label }}-${{ matrix.arch }}.zip"
          mkdir -p "dist/${EXT_NAME}"
          find build/Release -name "${EXT_NAME}.${{ matrix.lib_ext }}" -exec cp {} "dist/${EXT_NAME}/" \; 2>/dev/null || true
          cp "extensions/${EXT_NAME}/manifest.json" "dist/${EXT_NAME}/" 2>/dev/null || true
          ls -la "dist/${EXT_NAME}/"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Compress artifacts (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r "../${{ env.ZIP_NAME }}" .

      - name: Compress artifacts (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "$env:ZIP_NAME"
          Write-Host "Package created: $env:ZIP_NAME"

      - name: Generate checksum (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        shell: bash
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"
          else
            shasum -a 256 "${{ env.ZIP_NAME }}" > "${{ env.ZIP_NAME }}.sha256"
          fi
          cat "${{ env.ZIP_NAME }}.sha256"

      - name: Generate checksum (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "$env:ZIP_NAME").Hash.ToLower()
          "$hash  $env:ZIP_NAME" | Out-File -Encoding ascii "$env:ZIP_NAME.sha256"
          Get-Content "$env:ZIP_NAME.sha256"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          generate_release_notes: ${{ matrix.runner == 'ubuntu-22.04' }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
