[workspace]
name = "pj-test-dummy-plugins"
version = "1.0.0"
description = "PlotJuggler dummy plugins — pixi + conan 2.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
cmake   = ">=3.25"
ninja   = "*"
conan   = ">=2.0,<3"
ccache  = "*"

[target.linux-64.dependencies]
c-compiler   = "*"
cxx-compiler = "*"

[target.linux-aarch64.dependencies]
c-compiler   = "*"
cxx-compiler = "*"

[target.win-64.dependencies]
c-compiler   = "*"
cxx-compiler = "*"

[target.osx-64.dependencies]
c-compiler   = "*"
cxx-compiler = "*"

[target.osx-arm64.dependencies]
c-compiler   = "*"
cxx-compiler = "*"

[tasks]
conan-profile = "conan profile detect --force"

conan-install = { depends-on = ["conan-profile"], cmd = "conan install . --output-folder=build --build=missing -s build_type=Release" }

configure = { depends-on = ["conan-install"], cmd = "cmake -S . -B build/Release -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_PREFIX_PATH=build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -GNinja" }

build = { depends-on = ["configure"], cmd = "cmake --build build/Release --parallel" }

test = { depends-on = ["build"], cmd = "ctest --test-dir build/Release -V --output-on-failure" }

all = { depends-on = ["test"] }

clean = "rm -rf build"
